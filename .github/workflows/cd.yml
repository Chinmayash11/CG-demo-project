name: CD — Terraform Apply & Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write    # Required for AWS OIDC
  contents: read

env:
  TF_VERSION:     "1.7.5"
  TF_WORKING_DIR: "./terraform"
  AWS_REGION:     "us-east-1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore Terraform local state cache
        uses: actions/cache@v4
        with:
          path: |
            terraform/.terraform
            terraform/terraform.tfstate
            terraform/terraform.tfstate.backup
          key: terraform-state-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: terraform-state-${{ runner.os }}-

      # ── 2. Authenticate to AWS via OIDC ─────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      # ── 3. Setup Terraform ───────────────────────────────────────────────────
      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 4. Terraform Init ────────────────────────────────────────────────────
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── 5. Terraform Plan ────────────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="key_pair_name=${{ secrets.EC2_KEY_PAIR_NAME }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── 6. Terraform Apply ───────────────────────────────────────────────────
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── 7. Capture outputs ───────────────────────────────────────────────────
      - name: Capture Terraform Outputs
        id: tf_output
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip)
          WEBSITE_URL=$(terraform output -raw website_url)
          echo "ec2_ip=${EC2_IP}"         >> $GITHUB_OUTPUT
          echo "website_url=${WEBSITE_URL}" >> $GITHUB_OUTPUT
          echo "EC2_IP=${EC2_IP}"         >> $GITHUB_ENV
          echo "WEBSITE_URL=${WEBSITE_URL}" >> $GITHUB_ENV
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── 8. Verify instance is running ────────────────────────────────────────
      - name: Verify EC2 instance status
        run: |
          echo "Verifying EC2 instance is running..."
          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids $(terraform output -raw instance_id) \
            --region ${{ env.AWS_REGION }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          
          echo "Instance state: $INSTANCE_STATE"
          
          if [ "$INSTANCE_STATE" != "running" ]; then
            echo "❌ Instance is not in running state"
            exit 1
          fi
          echo "✅ Instance is running"
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── 9. Wait for EC2 User Data to complete ───────────────────────────────
      - name: Wait for EC2 bootstrap and Nginx startup
        run: |
          echo "Waiting 180 seconds for EC2 bootstrap and Nginx to start..."
          echo "This allows time for:"
          echo "  • System package updates"
          echo "  • Nginx installation"
          echo "  • Website files deployment"
          echo "  • Service startup"
          echo ""
          
          for i in {1..18}; do
            ELAPSED=$((i * 10))
            echo "[$ELAPSED/180s] Waiting..."
            sleep 10
          done
          
          echo "✅ Initial wait complete. Beginning validation..."

      # ── 10. Validate deployment ──────────────────────────────────────────────
      - name: Validate Website is Accessible
        run: |
          echo "Testing website accessibility..."
          echo "URL: ${{ env.WEBSITE_URL }}"
          echo ""
          
          MAX_ATTEMPTS=20
          RETRY_DELAY=10
          HTTP_STATUS="000"
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i/$MAX_ATTEMPTS..."
            
            # Try to connect with detailed error handling
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 --connect-timeout 3 "${{ env.WEBSITE_URL }}" 2>/dev/null || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Website is live! HTTP $HTTP_STATUS"
              break
            elif [ "$HTTP_STATUS" = "000" ]; then
              echo "   ⏳ Connection timeout/refused. Instance may still be starting..."
            else
              echo "   ⚠️  HTTP $HTTP_STATUS received"
            fi
            
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "   Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Validation successful!"
            echo "Website is accessible and responding with HTTP 200"
          else
            echo "❌ Validation failed"
            echo "Final HTTP status: $HTTP_STATUS"
            echo ""
            echo "Troubleshooting tips:"
            echo "  1. Check EC2 instance security group allows port 80"
            echo "  2. Verify instance has a public IP address"
            echo "  3. SSH to instance and check: sudo systemctl status nginx"
            echo "  4. Check user data logs: tail -f /var/log/userdata.log"
            exit 1
          fi

      # ── 11. Deployment Summary ──────────────────────────────────────────────
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| EC2 Public IP | \`${{ env.EC2_IP }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Website URL | [${{ env.WEBSITE_URL }}](${{ env.WEBSITE_URL }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Time | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
